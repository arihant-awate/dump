<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Rewind - Time Travel Demo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 121, 198, 0.3) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px;
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.1),
                0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 900px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: #fff;
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #gameArea {
            position: relative;
            width: 100%;
            max-width: 700px;
            aspect-ratio: 700 / 450;
            margin: 0 auto 24px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 
                inset 0 2px 20px rgba(0, 0, 0, 0.5),
                0 10px 40px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #player {
            position: absolute;
            width: 7.14%;
            height: 11.11%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            top: 44.44%;
            left: 46.43%;
            box-shadow: 
                0 8px 32px rgba(102, 126, 234, 0.6),
                0 0 60px rgba(118, 75, 162, 0.4),
                inset 0 -2px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s ease;
        }

        #player::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 6px;
            box-shadow: 0 2px 10px rgba(255, 255, 255, 0.3);
        }

        .progress-wrapper {
            max-width: 700px;
            margin: 0 auto 32px;
        }

        .progress-bar-container {
            position: relative;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #34d399);
            border-radius: 10px;
            width: 0%;
            transition: width 0.1s linear;
            position: relative;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
        }

        .controls {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        button {
            padding: 18px 40px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        #replayBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }

        #replayBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.5);
        }

        #resetBtn {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            box-shadow: 0 4px 20px rgba(236, 72, 153, 0.4);
        }

        #resetBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(236, 72, 153, 0.5);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        button:active:not(:disabled) {
            transform: translateY(0px);
        }

        #status {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            min-height: 24px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 32px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .instructions {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 28px;
            margin-top: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .instructions h3 {
            color: #fff;
            margin-bottom: 16px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .instructions p {
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.8;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .key-hint {
            display: inline-block;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 700;
            margin: 0 3px;
            color: #fff;
            font-family: 'Space Grotesk', monospace;
            box-shadow: 
                0 2px 10px rgba(102, 126, 234, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 
                    0 8px 32px rgba(102, 126, 234, 0.6),
                    0 0 60px rgba(118, 75, 162, 0.4),
                    inset 0 -2px 8px rgba(0, 0, 0, 0.3);
            }
            50% {
                box-shadow: 
                    0 8px 32px rgba(102, 126, 234, 0.8),
                    0 0 80px rgba(118, 75, 162, 0.6),
                    inset 0 -2px 8px rgba(0, 0, 0, 0.3);
            }
        }

        .replaying #player {
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }
            100% {
                background-position: 1000px 0;
            }
        }

        .progress-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite;
        }

        @media (max-width: 768px) {
            .container {
                padding: 32px 20px;
            }

            h1 {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 0.85rem;
            }

            button {
                padding: 16px 32px;
                font-size: 14px;
            }

            .instructions {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 16px;
            }

            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 0.75rem;
                letter-spacing: 1px;
            }

            button {
                padding: 14px 24px;
                font-size: 13px;
            }

            .instructions h3 {
                font-size: 1rem;
            }

            .instructions p {
                font-size: 14px;
            }

            #status {
                font-size: 13px;
                padding: 10px 16px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Spring Rewind</h1>
        <p class="subtitle">Reactive Time Travel</p>
    </div>

    <div id="gameArea">
        <div id="player"></div>
    </div>

    <div class="progress-wrapper">
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <div id="status"></div>

    <div class="controls">
        <button id="replayBtn">▶ Replay</button>
        <button id="resetBtn">⟳ Reset</button>
    </div>

    <div class="instructions">
        <h3>How to Use</h3>
        <p>Move with <span class="key-hint">W</span> <span class="key-hint">A</span> <span class="key-hint">S</span> <span class="key-hint">D</span> keys</p>
        <p>Click <strong>Replay</strong> to watch your movements play back in real-time</p>
        <p>Moving again automatically starts a new recording</p>
    </div>
</div>

<script>
    const BASE_URL = "http://localhost:8080/api";

    const player = document.getElementById("player");
    const gameArea = document.getElementById("gameArea");
    const replayBtn = document.getElementById("replayBtn");
    const resetBtn = document.getElementById("resetBtn");
    const status = document.getElementById("status");
    const progressBar = document.getElementById("progressBar");

    const SPEED = 150;
    let GAME_WIDTH = 700;
    let GAME_HEIGHT = 450;

    // Update game dimensions based on actual rendered size
    function updateGameDimensions() {
        const rect = gameArea.getBoundingClientRect();
        GAME_WIDTH = rect.width;
        GAME_HEIGHT = rect.height;
    }

    // Initial setup
    updateGameDimensions();
    window.addEventListener('resize', updateGameDimensions);

    let position = { x: GAME_WIDTH * 0.4643, y: GAME_HEIGHT * 0.4444 };
    let keysPressed = new Set();
    let isReplaying = false;
    let animationFrameId = null;
    let lastUpdateTime = Date.now();
    let hasRecordedMovement = false;
    
    // Replay state
    let replaySegments = [];
    let replayStartTime = null;
    let replayStartTimestamp = null;
    let segmentIndex = 0;
    let totalReplayDuration = 0;

    function updatePlayerPosition() {
        const rect = gameArea.getBoundingClientRect();
        const playerWidth = rect.width * 0.0714; // 7.14% of game area
        const playerHeight = rect.height * 0.1111; // 11.11% of game area
        
        player.style.left = position.x + "px";
        player.style.top = position.y + "px";
    }

    function gameLoop() {
        if (isReplaying) return;

        const now = Date.now();
        const deltaTime = (now - lastUpdateTime) / 1000;
        lastUpdateTime = now;

        if (keysPressed.size > 0) {
            const distance = SPEED * deltaTime;
            let moved = false;
            
            const rect = gameArea.getBoundingClientRect();
            const playerWidth = rect.width * 0.0714;
            const playerHeight = rect.height * 0.1111;

            if (keysPressed.has('w')) {
                position.y = Math.max(0, position.y - distance);
                moved = true;
            }
            if (keysPressed.has('s')) {
                position.y = Math.min(rect.height - playerHeight, position.y + distance);
                moved = true;
            }
            if (keysPressed.has('a')) {
                position.x = Math.max(0, position.x - distance);
                moved = true;
            }
            if (keysPressed.has('d')) {
                position.x = Math.min(rect.width - playerWidth, position.x + distance);
                moved = true;
            }

            if (moved) {
                updatePlayerPosition();
            }
        }

        animationFrameId = requestAnimationFrame(gameLoop);
    }

    gameLoop();

    document.addEventListener("keydown", (e) => {
        if (isReplaying) return;

        const key = e.key.toLowerCase();
        if (!['w', 'a', 's', 'd'].includes(key)) return;

        e.preventDefault();

        if (!keysPressed.has(key)) {
            keysPressed.add(key);
            
            if (!hasRecordedMovement) {
                clearPreviousData().then(() => {
                    hasRecordedMovement = true;
                    sendInputToServer(key.toUpperCase(), "DOWN");
                });
            } else {
                sendInputToServer(key.toUpperCase(), "DOWN");
            }
        }
    });

    document.addEventListener("keyup", (e) => {
        if (isReplaying) return;

        const key = e.key.toLowerCase();
        if (!['w', 'a', 's', 'd'].includes(key)) return;

        e.preventDefault();

        keysPressed.delete(key);
        sendInputToServer(key.toUpperCase(), "UP");
    });

    function sendInputToServer(key, action) {
        const payload = {
            key: key,
            action: action,
            timestamp: Date.now(),
            x: position.x,
            y: position.y
        };

        fetch(`${BASE_URL}/input`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            console.log("Input recorded:", data);
        })
        .catch(error => {
            console.error("Error sending input:", error);
        });
    }

    function clearPreviousData() {
        console.log("Clearing previous recording data...");
        return fetch(`${BASE_URL}/reset`, {
            method: "POST"
        })
        .then(() => {
            console.log("Previous data cleared");
            status.textContent = "🎬 New recording started";
            setTimeout(() => {
                status.textContent = "";
            }, 2000);
        })
        .catch(error => {
            console.error("Error clearing data:", error);
        });
    }

    replayBtn.addEventListener("click", () => {
        if (isReplaying) return;

        console.log("Replay started...");
        isReplaying = true;
        keysPressed.clear();
        replayBtn.disabled = true;
        resetBtn.disabled = true;
        status.textContent = "⏳ Loading replay...";

        replaySegments = [];
        segmentIndex = 0;
        replayStartTime = null;
        replayStartTimestamp = null;
        progressBar.style.width = '0%';

        if (typeof EventSource !== 'undefined') {
            startSSEReplay();
        } else {
            startRegularReplay();
        }
    });

    function startSSEReplay() {
        const activeKeys = new Set();
        let dataComplete = false;
        let animationStarted = false;

        const eventSource = new EventSource(`${BASE_URL}/replay-stream`);

        eventSource.onmessage = (event) => {
            try {
                const frame = JSON.parse(event.data);
                console.log("Received frame:", frame);

                if (frame.action === "DOWN") {
                    activeKeys.add(frame.key);
                } else if (frame.action === "UP") {
                    activeKeys.delete(frame.key);
                }

                replaySegments.push({
                    timestamp: frame.timestamp,
                    x: frame.x,
                    y: frame.y,
                    activeKeys: new Set(activeKeys)
                });

                if (replaySegments.length === 1 && !animationStarted) {
                    animationStarted = true;
                    status.textContent = "▶️ Replaying...";
                    gameArea.classList.add('replaying');
                    requestAnimationFrame(animateReplay);
                }
            } catch (e) {
                console.error("Error parsing frame:", e);
            }
        };

        eventSource.addEventListener('end', () => {
            console.log("Stream complete");
            dataComplete = true;
            eventSource.close();
            
            if (!animationStarted) {
                console.log("No replay data received");
                status.textContent = "❌ No replay data available";
                endReplay();
            } else if (replaySegments.length > 0) {
                totalReplayDuration = replaySegments[replaySegments.length - 1].timestamp - replaySegments[0].timestamp;
            }
        });

        eventSource.onerror = (error) => {
            console.error("SSE error:", error);
            eventSource.close();
            
            if (replaySegments.length === 0) {
                console.log("No SSE data, falling back to regular fetch");
                startRegularReplay();
            } else {
                dataComplete = true;
            }
        };

        function animateReplay() {
            if (!isReplaying) return;

            if (replayStartTime === null) {
                replayStartTime = performance.now();
                replayStartTimestamp = replaySegments[0].timestamp;
                position.x = replaySegments[0].x;
                position.y = replaySegments[0].y;
                updatePlayerPosition();
            }

            const elapsed = performance.now() - replayStartTime;
            const currentTimestamp = replayStartTimestamp + elapsed;

            if (totalReplayDuration > 0) {
                const progress = (elapsed / totalReplayDuration) * 100;
                progressBar.style.width = Math.min(progress, 100) + '%';
            }

            while (segmentIndex < replaySegments.length - 1 && 
                   replaySegments[segmentIndex + 1].timestamp <= currentTimestamp) {
                segmentIndex++;
            }

            if (segmentIndex >= replaySegments.length - 1 && dataComplete) {
                console.log("Replay complete");
                status.textContent = "✅ Replay complete";
                progressBar.style.width = '100%';
                endReplay();
                return;
            }

            if (segmentIndex >= replaySegments.length - 1 && !dataComplete) {
                requestAnimationFrame(animateReplay);
                return;
            }

            const currentSegment = replaySegments[segmentIndex];
            const nextSegment = replaySegments[segmentIndex + 1];
            
            const segmentDuration = nextSegment.timestamp - currentSegment.timestamp;
            const segmentElapsed = currentTimestamp - currentSegment.timestamp;

            if (currentSegment.activeKeys.size > 0) {
                let vx = 0, vy = 0;
                
                if (currentSegment.activeKeys.has('W')) vy -= SPEED;
                if (currentSegment.activeKeys.has('S')) vy += SPEED;
                if (currentSegment.activeKeys.has('A')) vx -= SPEED;
                if (currentSegment.activeKeys.has('D')) vx += SPEED;
                
                const timeInSeconds = segmentElapsed / 1000;
                position.x = currentSegment.x + (vx * timeInSeconds);
                position.y = currentSegment.y + (vy * timeInSeconds);
                
                const rect = gameArea.getBoundingClientRect();
                const playerWidth = rect.width * 0.0714;
                const playerHeight = rect.height * 0.1111;
                
                position.x = Math.max(0, Math.min(rect.width - playerWidth, position.x));
                position.y = Math.max(0, Math.min(rect.height - playerHeight, position.y));
            } else {
                const segmentProgress = Math.min(segmentElapsed / segmentDuration, 1);
                position.x = currentSegment.x + (nextSegment.x - currentSegment.x) * segmentProgress;
                position.y = currentSegment.y + (nextSegment.y - currentSegment.y) * segmentProgress;
            }

            updatePlayerPosition();
            requestAnimationFrame(animateReplay);
        }
    }

    function startRegularReplay() {
        fetch(`${BASE_URL}/replay`)
            .then(res => res.json())
            .then(frames => {
                console.log("Replay frames:", frames);

                if (frames.length === 0) {
                    console.log("No replay data");
                    status.textContent = "❌ No replay data available";
                    endReplay();
                    return;
                }

                const activeKeys = new Set();
                
                for (let i = 0; i < frames.length; i++) {
                    const frame = frames[i];
                    
                    if (frame.action === "DOWN") {
                        activeKeys.add(frame.key);
                    } else if (frame.action === "UP") {
                        activeKeys.delete(frame.key);
                    }
                    
                    replaySegments.push({
                        timestamp: frame.timestamp,
                        x: frame.x,
                        y: frame.y,
                        activeKeys: new Set(activeKeys)
                    });
                }

                totalReplayDuration = replaySegments[replaySegments.length - 1].timestamp - replaySegments[0].timestamp;
                status.textContent = "▶️ Replaying...";
                gameArea.classList.add('replaying');
                startReplayAnimation();
            })
            .catch(error => {
                console.error("Error during replay:", error);
                status.textContent = "❌ Error loading replay";
                endReplay();
            });
    }

    function startReplayAnimation() {
        replayStartTime = performance.now();
        replayStartTimestamp = replaySegments[0].timestamp;
        position.x = replaySegments[0].x;
        position.y = replaySegments[0].y;
        updatePlayerPosition();

        function animateReplay() {
            if (!isReplaying) return;

            const elapsed = performance.now() - replayStartTime;
            const currentTimestamp = replayStartTimestamp + elapsed;

            if (totalReplayDuration > 0) {
                const progress = (elapsed / totalReplayDuration) * 100;
                progressBar.style.width = Math.min(progress, 100) + '%';
            }

            while (segmentIndex < replaySegments.length - 1 && 
                   replaySegments[segmentIndex + 1].timestamp <= currentTimestamp) {
                segmentIndex++;
            }

            if (segmentIndex >= replaySegments.length - 1) {
                console.log("Replay complete");
                status.textContent = "✅ Replay complete";
                progressBar.style.width = '100%';
                endReplay();
                return;
            }

            const currentSegment = replaySegments[segmentIndex];
            const nextSegment = replaySegments[segmentIndex + 1];
            
            const segmentDuration = nextSegment.timestamp - currentSegment.timestamp;
            const segmentElapsed = currentTimestamp - currentSegment.timestamp;

            if (currentSegment.activeKeys.size > 0) {
                let vx = 0, vy = 0;
                
                if (currentSegment.activeKeys.has('W')) vy -= SPEED;
                if (currentSegment.activeKeys.has('S')) vy += SPEED;
                if (currentSegment.activeKeys.has('A')) vx -= SPEED;
                if (currentSegment.activeKeys.has('D')) vx += SPEED;
                
                const timeInSeconds = segmentElapsed / 1000;
                position.x = currentSegment.x + (vx * timeInSeconds);
                position.y = currentSegment.y + (vy * timeInSeconds);
                
                const rect = gameArea.getBoundingClientRect();
                const playerWidth = rect.width * 0.0714;
                const playerHeight = rect.height * 0.1111;
                
                position.x = Math.max(0, Math.min(rect.width - playerWidth, position.x));
                position.y = Math.max(0, Math.min(rect.height - playerHeight, position.y));
            } else {
                const segmentProgress = Math.min(segmentElapsed / segmentDuration, 1);
                position.x = currentSegment.x + (nextSegment.x - currentSegment.x) * segmentProgress;
                position.y = currentSegment.y + (nextSegment.y - currentSegment.y) * segmentProgress;
            }

            updatePlayerPosition();
            requestAnimationFrame(animateReplay);
        }

        requestAnimationFrame(animateReplay);
    }

    function endReplay() {
        isReplaying = false;
        replayBtn.disabled = false;
        resetBtn.disabled = false;
        gameArea.classList.remove('replaying');
        lastUpdateTime = Date.now();
        hasRecordedMovement = false;
    }

    resetBtn.addEventListener("click", () => {
        if (isReplaying) {
            endReplay();
        }
        
        keysPressed.clear();
        const rect = gameArea.getBoundingClientRect();
        position = { x: rect.width * 0.4643, y: rect.height * 0.4444 };
        updatePlayerPosition();
        status.textContent = "🔄 Game reset";
        progressBar.style.width = '0%';
        replaySegments = [];
        segmentIndex = 0;
        totalReplayDuration = 0;
        hasRecordedMovement = false;

        fetch(`${BASE_URL}/reset`, {
            method: "POST"
        })
        .then(() => {
            console.log("Game reset");
            setTimeout(() => {
                status.textContent = "";
            }, 2000);
        })
        .catch(error => {
            console.error("Error resetting:", error);
            status.textContent = "❌ Error resetting";
        });
    });
